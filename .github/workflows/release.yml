name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ========================================
  # Create Release
  # ========================================
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: fortably/convco-changelog-action@v2
        with:
          from: $(git describe --tags --abbrev=0 HEAD^)
          to: HEAD

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # Build and Push Docker Images
  # ========================================
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            yflow/backend
            yflow/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./admin-backend
          file: ./admin-backend/Dockerfile
          push: true
          tags: |
            yflow/backend:${{ github.ref_name }}
            yflow/backend:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          file: ./admin-frontend/Dockerfile
          push: true
          tags: |
            yflow/frontend:${{ github.ref_name }}
            yflow/frontend:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Build CLI Binaries
  # ========================================
  cli:
    name: Build CLI Binaries
    runs-on: ${{ matrix.os }}
    needs: release
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli -> target

      - name: Install Linux aarch64 linker
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build binary
        run: |
          set -euo pipefail
          cargo build --release --manifest-path cli/Cargo.toml --target "${{ matrix.target }}"
          mkdir -p cli/bin
          OUTPUT_NAME="yflow-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          cp "cli/target/${{ matrix.target }}/release/yflow${{ matrix.ext }}" "cli/bin/${OUTPUT_NAME}"

      - name: Upload binary
        uses: softprops/action-gh-release@v1
        with:
          files: cli/bin/yflow-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
